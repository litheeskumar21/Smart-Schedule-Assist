<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-role="admin" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course & Subject Management | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar('subjects')}"></aside>
    <main class="main-content">
        <header class="header" th:replace="~{fragments/header :: header('Subject & Faculty Assignments')}"></header>
        <div class="content-wrapper">
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

            <div class="page-header">
                <div class="page-header-left">
                    <h1 class="page-title">Course & Subject Management</h1>
                </div>
                <div class="page-header-actions">
                    <div class="search-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" class="form-control search-input" placeholder="Search subjects...">
                    </div>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px;">
                <!-- Create / Edit Subject Form -->
                <div class="card">
                    <div class="card-header">
                        <span class="card-title" th:text="${editSubject != null ? '✏️ Edit Subject' : '➕ Create New Subject'}">Create Subject</span>
                    </div>

                    <form th:action="${editSubject != null} ? @{'/admin/subjects/edit/' + ${editSubject.id}} : @{/admin/subjects}" method="post" style="margin-top: 16px;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Subject Code *</label>
                                <input type="text" name="code" class="form-control" required placeholder="e.g., CS201" style="text-transform: uppercase;"
                                       th:value="${editSubject != null ? editSubject.code : ''}">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Subject Name *</label>
                                <input type="text" name="name" class="form-control" required placeholder="e.g., Data Structures"
                                       th:value="${editSubject != null ? editSubject.name : ''}">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Type *</label>
                                <select name="type" class="form-control form-select" required>
                                    <option value="THEORY" th:selected="${editSubject != null && editSubject.type.name() == 'THEORY'}">THEORY</option>
                                    <option value="LAB" th:selected="${editSubject != null && editSubject.type.name() == 'LAB'}">LAB / PRACTICAL</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Periods / Week *</label>
                                <input type="number" name="periodsPerWeek" class="form-control" min="1" max="10" required
                                       th:value="${editSubject != null ? editSubject.periodsPerWeek : 3}">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Department *</label>
                                <select name="departmentId" class="form-control form-select" required>
                                    <option value="">-- Choose Dept --</option>
                                    <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name + ' (' + d.code + ')'}"
                                            th:selected="${editSubject != null && editSubject.department != null && editSubject.department.id == d.id}">CSE</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Academic Year *</label>
                                <select name="academicYearId" class="form-control form-select" required>
                                    <option value="">-- Choose Year --</option>
                                    <option th:each="y : ${years}" th:value="${y.id}" th:text="${y.label}"
                                            th:selected="${editSubject != null && editSubject.academicYear != null && editSubject.academicYear.id == y.id}">2nd Year</option>
                                </select>
                            </div>
                        </div>

                        <div style="display: flex; gap: 12px; margin-top: 12px;">
                            <button type="submit" class="btn btn-primary" th:text="${editSubject != null ? 'Update Subject' : 'Create Subject'}">Save</button>
                            <a th:if="${editSubject != null}" th:href="@{/admin/subjects}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>

                <!-- Subject Teacher Assignment to Section Form -->
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">🔗 Assign Subject & Teacher to Section</span>
                    </div>

                    <form th:action="@{/admin/subjects/assign}" method="post" style="margin-top: 16px;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="form-group">
                            <label class="form-label">Select Subject *</label>
                            <select name="subjectId" class="form-control form-select" required>
                                <option value="">-- Select Subject --</option>
                                <option th:each="sub : ${subjects}" th:value="${sub.id}" th:text="${sub.code + ' - ' + sub.name + ' (' + sub.type + ')'}">CS201</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Assign Faculty / Teacher *</label>
                            <select name="teacherId" class="form-control form-select" required>
                                <option value="">-- Select Teacher --</option>
                                <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.user.fullName + ' (' + t.teacherId + ')'}">Dr. Kumar</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Target Section *</label>
                            <select name="sectionId" class="form-control form-select" required>
                                <option value="">-- Select Section --</option>
                                <option th:each="sec : ${sections}" th:value="${sec.id}" th:text="${sec.displayName}">CSE-A</option>
                            </select>
                        </div>

                        <div style="margin-top: 16px;">
                            <button type="submit" class="btn btn-primary">Assign Teacher to Section</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Subjects List Table -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">📖 All Courses & Subjects (<span th:text="${subjects.size()}">0</span>)</span>
                </div>

                <div th:if="${#lists.isEmpty(subjects)}" class="empty-state">
                    <div style="font-size: 48px; margin-bottom: 16px;">📖</div>
                    <h3>No Subjects Found</h3>
                    <p>Create subjects to get started.</p>
                </div>

                <div th:unless="${#lists.isEmpty(subjects)}" style="overflow-x: auto; margin-top: 12px;">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>Code</th>
                            <th>Subject Name</th>
                            <th>Type</th>
                            <th>Periods / Wk</th>
                            <th>Department</th>
                            <th>Academic Year</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="sub : ${subjects}">
                            <td><strong style="color: var(--primary);" th:text="${sub.code}">CS201</strong></td>
                            <td th:text="${sub.name}">Data Structures</td>
                            <td>
                                <span th:if="${sub.type.name() == 'LAB'}" class="badge badge-warning">LAB</span>
                                <span th:if="${sub.type.name() == 'THEORY'}" class="badge badge-published">THEORY</span>
                            </td>
                            <td><strong th:text="${sub.periodsPerWeek}">4</strong></td>
                            <td th:text="${sub.department != null ? sub.department.name : '-'}">CSE</td>
                            <td th:text="${sub.academicYear != null ? sub.academicYear.label : '-'}">2nd Year</td>
                            <td>
                                <div class="table-actions">
                                    <a th:href="@{'/admin/subjects/edit/' + ${sub.id}}" class="btn btn-secondary btn-sm">Edit</a>
                                    <form th:action="@{'/admin/subjects/delete/' + ${sub.id}}" method="post" style="display: inline;" onsubmit="return confirm('Delete this subject?');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/mobile.js}"></script>
</body>
</html>
