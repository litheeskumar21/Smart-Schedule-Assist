<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements Management | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar('announcements')}"></aside>
    <main class="main-content">
        <header class="header" th:replace="~{fragments/header :: header('Announcements Management')}"></header>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <div class="flex-between flex-center mb-20">
            <h1 class="page-title" style="margin-bottom: 0;">Published Announcements (<span th:text="${announcements.size()}">0</span>)</h1>
            <a th:href="@{/admin/announcements/create}" class="btn btn-primary btn-sm">➕ Create New Announcement</a>
        </div>

        <div class="card">
            <div class="empty-state" th:if="${announcements.isEmpty()}">
                <div class="empty-icon">📢</div>
                <div class="empty-text">No announcements published yet.</div>
            </div>

            <div style="overflow-x: auto;" th:if="${!announcements.isEmpty()}">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>Title</th>
                        <th>Target Audience</th>
                        <th>Published Date</th>
                        <th>Created By</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${announcements}">
                        <td><strong th:text="${a.title}">Title</strong></td>
                        <td><span class="badge badge-published" th:text="${a.targetType}">EVERYONE</span></td>
                        <td class="text-muted" style="font-size: 12px;" th:text="${#temporals.format(a.publishedAt != null ? a.publishedAt : a.createdAt, 'MMM dd, yyyy HH:mm')}">Date</td>
                        <td th:text="${a.createdBy != null ? a.createdBy.fullName : 'Admin'}">Admin</td>
                        <td>
                            <div class="table-actions">
                                <a th:href="@{'/admin/announcements/edit/' + ${a.id}}" class="btn btn-secondary btn-sm">Edit</a>
                                <form th:action="@{'/admin/announcements/delete/' + ${a.id}}" method="post" style="display: inline;" onsubmit="return confirm('Delete this announcement?');">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/mobile.js}"></script>
</body>
</html>
