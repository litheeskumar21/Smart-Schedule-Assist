<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar('settings')}"></aside>
    <main class="main-content">
        <header class="header" th:replace="~{fragments/header :: header('System Settings')}"></header>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <!-- Academic Configuration Card -->
        <div class="card mb-24" style="max-width: 600px;">
            <div class="card-header">
                <span class="card-title">⚙️ Academic Year & Semester Configuration</span>
            </div>

            <form th:action="@{/admin/settings}" method="post" style="margin-top: 16px;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Current Academic Year</label>
                        <input type="text" name="academicYear" class="form-control" required th:value="${academicYear}" placeholder="e.g., 2026-2027">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Current Running Semester</label>
                        <input type="text" name="currentSemester" class="form-control" required th:value="${currentSemester}" placeholder="e.g., 3">
                    </div>
                </div>

                <div style="margin-top: 12px;">
                    <button type="submit" class="btn btn-primary">Save Academic Settings</button>
                </div>
            </form>
        </div>

        <!-- Period Timings Manager -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">🕒 Period & Bell Schedule Timings</span>
            </div>

            <div style="overflow-x: auto; margin-top: 16px;">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>Period #</th>
                        <th>Type</th>
                        <th>Start Time</th>
                        <th>End Time</th>
                        <th>Update Timings</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${periods}">
                        <td><strong th:text="${'Period ' + p.periodNumber}">Period 1</strong></td>
                        <td>
                            <span th:if="${p.type.name() == 'CLASS'}" class="badge badge-published">CLASS</span>
                            <span th:if="${p.type.name() == 'BREAK'}" class="badge badge-pending">SHORT BREAK</span>
                            <span th:if="${p.type.name() == 'LUNCH'}" class="badge badge-warning">LUNCH BREAK</span>
                        </td>
                        <form th:action="@{'/admin/settings/period/' + ${p.id}}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <td>
                                <input type="time" name="startTime" class="form-control" style="width: 140px; display: inline-block;" th:value="${p.startTime}" required>
                            </td>
                            <td>
                                <input type="time" name="endTime" class="form-control" style="width: 140px; display: inline-block;" th:value="${p.endTime}" required>
                            </td>
                            <td>
                                <button type="submit" class="btn btn-secondary btn-sm">Update Timing</button>
                            </td>
                        </form>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/mobile.js}"></script>
</body>
</html>
