<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Audit & Activity Log | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar('activity-log')}"></aside>
    <main class="main-content">
        <header class="header" th:replace="~{fragments/header :: header('Activity & Audit Log')}"></header>

        <div class="flex-between flex-center mb-20">
            <h1 class="page-title" style="margin-bottom: 0;">Audit Log Entries (<span th:text="${totalElements}">0</span>)</h1>
        </div>

        <div class="card">
            <div style="overflow-x: auto;">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th style="width: 18%;">Timestamp</th>
                        <th style="width: 16%;">Action Type</th>
                        <th style="width: 14%;">Entity Target</th>
                        <th style="width: 18%;">Performed By</th>
                        <th style="width: 34%;">Details & Summary</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="log : ${activityLogs}">
                        <td class="text-muted" style="font-size: 12px;" th:text="${#temporals.format(log.timestamp, 'MMM dd, yyyy HH:mm:ss')}">Timestamp</td>
                        <td><span class="badge badge-published" th:text="${log.action}">ACTION</span></td>
                        <td><strong th:text="${log.entityType != null ? log.entityType : '-'}">Entity</strong></td>
                        <td><strong th:text="${log.performedBy != null ? log.performedBy.fullName : 'System'}">User</strong></td>
                        <td th:text="${log.details}">Action details</td>
                    </tr>
                    <tr th:if="${activityLogs.isEmpty()}">
                        <td colspan="5" class="text-muted" style="text-align: center; padding: 20px;">No activity logged yet.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination Bar -->
            <div class="pagination mt-16" th:if="${totalPages > 1}">
                <a th:if="${currentPage > 0}" th:href="@{/admin/activity-log(page=${currentPage - 1})}" class="page-link">← Previous</a>
                <span class="page-link active" th:text="${'Page ' + (currentPage + 1) + ' of ' + totalPages}">Page 1 of 5</span>
                <a th:if="${currentPage < totalPages - 1}" th:href="@{/admin/activity-log(page=${currentPage + 1})}" class="page-link">Next →</a>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/mobile.js}"></script>
</body>
</html>
