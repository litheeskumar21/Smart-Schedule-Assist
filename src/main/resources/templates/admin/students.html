<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar('students')}"></aside>
    <main class="main-content">
        <header class="header" th:replace="~{fragments/header :: header('Student Directory')}"></header>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${warningMessage}" class="alert alert-warning" th:text="${warningMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <div class="flex-between flex-center mb-20">
            <div>
                <h1 class="page-title" style="margin-bottom: 0;">Enrolled Students (<span th:text="${students.size()}">0</span>)</h1>
            </div>
            <div style="display: flex; gap: 10px;">
                <a th:href="@{/admin/import/students}" class="btn btn-secondary btn-sm">📥 Batch Import (CSV/Excel)</a>
                <a th:href="@{/admin/students/create}" class="btn btn-primary btn-sm">➕ Add New Student</a>
            </div>
        </div>

        <div class="card">
            <div style="overflow-x: auto;">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Year</th>
                        <th>Section</th>
                        <th>Semester</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s : ${students}">
                        <td><strong style="color: var(--primary);" th:text="${s.studentId}">S001</strong></td>
                        <td><strong th:text="${s.user != null ? s.user.fullName : '-'}">John Doe</strong></td>
                        <td class="text-muted" th:text="${s.user != null ? s.user.email : '-'}">john@smartschedule.edu</td>
                        <td th:text="${s.department != null ? s.department.code : '-'}">CSE</td>
                        <td th:text="${s.academicYear != null ? s.academicYear.label : '-'}">2nd Year</td>
                        <td><span class="badge badge-published" th:text="${s.section != null ? s.section.displayName : '-'}">CSE-A</span></td>
                        <td><span th:text="${'Sem ' + s.semester}">Sem 3</span></td>
                        <td>
                            <div class="table-actions">
                                <a th:href="@{'/admin/students/edit/' + ${s.id}}" class="btn btn-secondary btn-sm">Edit</a>
                                <form th:action="@{'/admin/students/delete/' + ${s.id}}" method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this student account?');">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/mobile.js}"></script>
</body>
</html>
