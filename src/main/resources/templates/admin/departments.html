<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departments Management | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar('departments')}"></aside>
    <main class="main-content">
        <header class="header" th:replace="~{fragments/header :: header('Department Management')}"></header>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <!-- Add / Edit Department Card -->
        <div class="card mb-24" style="max-width: 600px;">
            <div class="card-header">
                <span class="card-title" th:text="${editDepartment != null ? '✏️ Edit Department' : '➕ Add New Department'}">Add Department</span>
            </div>

            <form th:action="${editDepartment != null} ? @{'/admin/departments/edit/' + ${editDepartment.id}} : @{/admin/departments}" method="post" style="margin-top: 16px;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Department Name *</label>
                        <input type="text" name="name" class="form-control" required placeholder="e.g., Computer Science and Engineering"
                               th:value="${editDepartment != null ? editDepartment.name : ''}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Department Code *</label>
                        <input type="text" name="code" class="form-control" required placeholder="e.g., CSE" style="text-transform: uppercase;"
                               th:value="${editDepartment != null ? editDepartment.code : ''}">
                    </div>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 12px;">
                    <button type="submit" class="btn btn-primary" th:text="${editDepartment != null ? 'Update Department' : 'Save Department'}">Save Department</button>
                    <a th:if="${editDepartment != null}" th:href="@{/admin/departments}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>

        <!-- Departments List Table -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">🏢 All Departments (<span th:text="${departments.size()}">0</span>)</span>
            </div>

            <div style="overflow-x: auto; margin-top: 12px;">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th style="width: 10%;">ID</th>
                        <th style="width: 25%;">Code</th>
                        <th style="width: 45%;">Department Name</th>
                        <th style="width: 20%;">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="d : ${departments}">
                        <td th:text="${d.id}">1</td>
                        <td><strong th:text="${d.code}">CSE</strong></td>
                        <td th:text="${d.name}">Computer Science and Engineering</td>
                        <td>
                            <div class="table-actions">
                                <a th:href="@{'/admin/departments/edit/' + ${d.id}}" class="btn btn-secondary btn-sm">Edit</a>
                                <form th:action="@{'/admin/departments/delete/' + ${d.id}}" method="post" style="display: inline;" onsubmit="return confirm('Delete this department?');">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/mobile.js}"></script>
</body>
</html>
