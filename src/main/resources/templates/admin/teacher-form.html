<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Edit Faculty' : 'Add Faculty'} + ' | Smart Schedule Assist'">Teacher Form</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar('teachers')}"></aside>
    <main class="main-content">
        <header class="header" th:replace="~{fragments/header :: header(${isEdit ? 'Edit Faculty' : 'Add Faculty'})}"></header>

        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <div class="card" style="max-width: 700px;">
            <div class="card-header">
                <span class="card-title" th:text="${isEdit ? '✏️ Edit Faculty Account' : '➕ Create New Faculty Account'}">Faculty Form</span>
            </div>

            <form th:action="${isEdit} ? @{'/admin/teachers/edit/' + ${teacher.id}} : @{/admin/teachers/create}" method="post" style="margin-top: 16px;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Teacher / Employee ID *</label>
                        <input type="text" name="teacherId" class="form-control" required placeholder="e.g., T016"
                               th:value="${teacher.teacherId}" th:readonly="${isEdit}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Full Name *</label>
                        <input type="text" name="fullName" class="form-control" required placeholder="e.g., Dr. Alan Turing"
                               th:value="${teacher.user != null ? teacher.user.fullName : ''}">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="e.g., alan@smartschedule.edu"
                               th:value="${teacher.user != null ? teacher.user.email : ''}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input type="text" name="phone" class="form-control" placeholder="e.g., 9876543210"
                               th:value="${teacher.phone}">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" th:text="${isEdit ? 'Password (leave blank to keep unchanged)' : 'Initial Password *'}">Password</label>
                    <input type="password" name="password" class="form-control" th:required="${!isEdit}" placeholder="Default: teacher123">
                </div>

                <div class="form-group">
                    <label class="form-label">Associated Departments (Select multiple if cross-appointed)</label>
                    <div style="display: flex; gap: 16px; flex-wrap: wrap; margin-top: 6px;">
                        <label th:each="d : ${departments}" style="display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer;">
                            <input type="checkbox" name="departmentIds" th:value="${d.id}"
                                   th:checked="${teacher.departments != null && teacher.departments.contains(d)}">
                            <span th:text="${d.name + ' (' + d.code + ')'}">CSE</span>
                        </label>
                    </div>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="submit" class="btn btn-primary" th:text="${isEdit ? 'Update Faculty' : 'Save Faculty'}">Save Faculty</button>
                    <a th:href="@{/admin/teachers}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/mobile.js}"></script>
</body>
</html>
