<!DOCTYPE html>
<html data-role="admin" data-theme="light" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Directory | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar('teachers')}"></aside>
    <main class="main-content">
        <header class="header" th:replace="~{fragments/header :: header('Faculty Directory')}"></header>

        <div class="content-wrapper">
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${warningMessage}" class="alert alert-warning" th:text="${warningMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

            <div class="page-header">
                <div class="page-header-left">
                    <h1 class="page-title">Teaching Faculty (<span th:text="${teachers.size()}">0</span>)</h1>
                </div>
                <div class="page-header-actions">
                    <a th:href="@{/admin/import/teachers}" class="btn btn-secondary">📥 Batch Import (CSV/Excel)</a>
                    <a th:href="@{/admin/teachers/create}" class="btn btn-primary">➕ Add Faculty</a>
                </div>
            </div>

            <div class="card">
                <div style="overflow-x: auto;">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>Teacher ID</th>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Departments</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="t : ${teachers}">
                            <td><strong style="color: var(--primary);" th:text="${t.teacherId}">T001</strong></td>
                            <td><strong th:text="${t.user != null ? t.user.fullName : '-'}">Dr. Kumar</strong></td>
                            <td class="text-muted" th:text="${t.user != null ? t.user.email : '-'}">kumar@smartschedule.edu</td>
                            <td th:text="${t.phone != null ? t.phone : '-'}">9876543210</td>
                            <td>
                                <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                                    <span th:each="d : ${t.departments}" class="badge badge-published" th:text="${d.code}">CSE</span>
                                </div>
                            </td>
                            <td>
                                <div class="table-actions">
                                    <a th:href="@{'/admin/timetables/teacher/' + ${t.id}}" class="btn-icon-sm btn-ghost" title="Schedule">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                                    </a>
                                    <a th:href="@{'/admin/teachers/edit/' + ${t.id}}" class="btn-icon-sm btn-ghost" title="Edit">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
                                    </a>
                                    <form th:action="@{'/admin/teachers/delete/' + ${t.id}}" method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this faculty member?');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn-icon-sm btn-ghost btn-danger style" title="Delete" style="border: none; background: transparent; cursor: pointer; color: var(--error);">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${teachers == null || teachers.isEmpty()}">
                            <td colspan="6" style="text-align: center; padding: 40px;">
                                <div class="empty-state">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-muted mb-16"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><polyline points="17 11 19 13 23 9"></polyline></svg>
                                    <h3>No Teachers Found</h3>
                                    <p class="text-muted">There are no faculty members registered yet.</p>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/mobile.js}"></script>
</body>
</html>
