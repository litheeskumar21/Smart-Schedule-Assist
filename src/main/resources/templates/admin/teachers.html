<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Directory | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar('teachers')}"></aside>
    <main class="main-content">
        <header class="header" th:replace="~{fragments/header :: header('Faculty Directory')}"></header>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${warningMessage}" class="alert alert-warning" th:text="${warningMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <div class="flex-between flex-center mb-20">
            <div>
                <h1 class="page-title" style="margin-bottom: 0;">Teaching Faculty (<span th:text="${teachers.size()}">0</span>)</h1>
            </div>
            <div style="display: flex; gap: 10px;">
                <a th:href="@{/admin/import/teachers}" class="btn btn-secondary btn-sm">📥 Batch Import (CSV/Excel)</a>
                <a th:href="@{/admin/teachers/create}" class="btn btn-primary btn-sm">➕ Add New Faculty</a>
            </div>
        </div>

        <div class="card">
            <div style="overflow-x: auto;">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>Teacher ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Departments</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="t : ${teachers}">
                        <td><strong style="color: var(--primary);" th:text="${t.teacherId}">T001</strong></td>
                        <td><strong th:text="${t.user != null ? t.user.fullName : '-'}">Dr. Kumar</strong></td>
                        <td class="text-muted" th:text="${t.user != null ? t.user.email : '-'}">kumar@smartschedule.edu</td>
                        <td th:text="${t.phone != null ? t.phone : '-'}">9876543210</td>
                        <td>
                            <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                                <span th:each="d : ${t.departments}" class="badge badge-published" th:text="${d.code}">CSE</span>
                            </div>
                        </td>
                        <td>
                            <div class="table-actions">
                                <a th:href="@{'/admin/timetables/teacher/' + ${t.id}}" class="btn btn-primary btn-sm">Schedule</a>
                                <a th:href="@{'/admin/teachers/edit/' + ${t.id}}" class="btn btn-secondary btn-sm">Edit</a>
                                <form th:action="@{'/admin/teachers/delete/' + ${t.id}}" method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this faculty member?');">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/mobile.js}"></script>
</body>
</html>
