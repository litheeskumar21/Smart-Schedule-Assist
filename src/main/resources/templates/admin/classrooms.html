<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-role="admin" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classrooms & Labs | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar('classrooms')}"></aside>
    <main class="main-content">
        <header class="header" th:replace="~{fragments/header :: header('Classroom & Lab Management')}"></header>
        <div class="content-wrapper">
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

            <div class="page-header">
                <div class="page-header-left">
                    <h1 class="page-title">Classrooms & Labs</h1>
                </div>
                <div class="page-header-actions">
                    <div class="search-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" class="form-control search-input" placeholder="Search rooms...">
                    </div>
                </div>
            </div>

            <!-- Add / Edit Classroom Card -->
            <div class="card mb-24" style="max-width: 650px;">
                <div class="card-header">
                    <span class="card-title" th:text="${editClassroom != null ? '✏️ Edit Classroom/Lab' : '➕ Add Classroom / Lab'}">Add Room</span>
                </div>

                <form th:action="${editClassroom != null} ? @{'/admin/classrooms/edit/' + ${editClassroom.id}} : @{/admin/classrooms}" method="post" style="margin-top: 16px;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Room Name / Number *</label>
                            <input type="text" name="name" class="form-control" required placeholder="e.g., Room 101 or CS Lab 1"
                                   th:value="${editClassroom != null ? editClassroom.name : ''}">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Seating Capacity *</label>
                            <input type="number" name="capacity" class="form-control" min="10" max="500" required
                                   th:value="${editClassroom != null ? editClassroom.capacity : 60}">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Room Type *</label>
                        <select name="roomType" class="form-control form-select" required>
                            <option th:each="t : ${roomTypes}" th:value="${t.name()}" th:text="${t.name()}"
                                    th:selected="${editClassroom != null && editClassroom.roomType == t}">CLASSROOM</option>
                        </select>
                    </div>

                    <div style="display: flex; gap: 12px; margin-top: 12px;">
                        <button type="submit" class="btn btn-primary" th:text="${editClassroom != null ? 'Update Room' : 'Create Room'}">Save</button>
                        <a th:if="${editClassroom != null}" th:href="@{/admin/classrooms}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>

            <!-- Classrooms List Table -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">🏫 All Classrooms & Labs (<span th:text="${classrooms.size()}">0</span>)</span>
                </div>

                <div th:if="${#lists.isEmpty(classrooms)}" class="empty-state">
                    <div style="font-size: 48px; margin-bottom: 16px;">🏫</div>
                    <h3>No Classrooms Found</h3>
                    <p>Add classrooms or labs to get started.</p>
                </div>

                <div th:unless="${#lists.isEmpty(classrooms)}" style="overflow-x: auto; margin-top: 12px;">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Room Name</th>
                            <th>Type</th>
                            <th>Capacity</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="c : ${classrooms}">
                            <td th:text="${c.id}">1</td>
                            <td><strong style="color: var(--primary);" th:text="${c.name}">Room 101</strong></td>
                            <td>
                                <span th:if="${c.roomType.name() == 'CLASSROOM'}" class="badge badge-published">CLASSROOM</span>
                                <span th:if="${c.roomType.name() != 'CLASSROOM'}" class="badge badge-warning" th:text="${c.roomType}">LAB</span>
                            </td>
                            <td><span th:text="${c.capacity + ' seats'}">60 seats</span></td>
                            <td>
                                <div class="table-actions">
                                    <a th:href="@{'/admin/classrooms/edit/' + ${c.id}}" class="btn btn-secondary btn-sm">Edit</a>
                                    <form th:action="@{'/admin/classrooms/delete/' + ${c.id}}" method="post" style="display: inline;" onsubmit="return confirm('Delete this classroom?');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/mobile.js}"></script>
</body>
</html>
