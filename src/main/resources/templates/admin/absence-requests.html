<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absence Requests Management | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar('absence-requests')}"></aside>
    <main class="main-content">
        <header class="header" th:replace="~{fragments/header :: header('Absence Requests')}"></header>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <div class="flex-between flex-center mb-20">
            <h1 class="page-title" style="margin-bottom: 0;">Faculty Absence Requests (<span th:text="${requests.size()}">0</span>)</h1>
        </div>

        <div class="card">
            <div class="empty-state" th:if="${requests.isEmpty()}">
                <div class="empty-icon">📝</div>
                <div class="empty-text">No faculty absence requests found.</div>
            </div>

            <div style="overflow-x: auto;" th:if="${!requests.isEmpty()}">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Faculty Member</th>
                        <th>Absence Date</th>
                        <th>Scope</th>
                        <th>Reason</th>
                        <th>Suggested Sub</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${requests}">
                        <td th:text="${r.id}">1</td>
                        <td>
                            <strong th:text="${r.teacher.user.fullName}">Prof. Name</strong><br>
                            <span class="text-muted" style="font-size: 12px;" th:text="${r.teacher.teacherId}">T001</span>
                        </td>
                        <td><strong th:text="${#temporals.format(r.absenceDate, 'MMM dd, yyyy (EEEE)')}">Oct 10, 2026</strong></td>
                        <td th:text="${r.absenceType == T(com.smartschedule.model.enums.AbsenceType).FULL_DAY ? 'Full Day' : 'Specific Periods'}">Full Day</td>
                        <td th:text="${r.reason}">Medical Leave</td>
                        <td th:text="${r.suggestedSubstitute != null ? r.suggestedSubstitute.user.fullName : '-'}">-</td>
                        <td>
                            <span th:if="${r.status.name() == 'PENDING'}" class="badge badge-pending">Pending Review</span>
                            <span th:if="${r.status.name() == 'APPROVED'}" class="badge badge-approved">Approved</span>
                            <span th:if="${r.status.name() == 'REJECTED'}" class="badge badge-rejected">Rejected</span>
                            <span th:if="${r.status.name() == 'WITHDRAWN'}" class="badge badge-withdrawn">Withdrawn</span>
                        </td>
                        <td>
                            <a th:href="@{'/admin/absence-requests/' + ${r.id}}" class="btn btn-primary btn-sm">View & Manage →</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/mobile.js}"></script>
</body>
</html>
