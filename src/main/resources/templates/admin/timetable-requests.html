<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-role="admin" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Timetable Requests | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar('timetable-requests')}"></aside>
    <main class="main-content">
        <header class="header" th:replace="~{fragments/header :: header('Timetable Change Requests')}"></header>
        <div class="content-wrapper">
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

            <div class="page-header">
                <div class="page-header-left">
                    <h1 class="page-title">Faculty Slot Change Requests (<span th:text="${requests.size()}">0</span>)</h1>
                </div>
                <div class="page-header-actions">
                    <div class="search-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" class="form-control search-input" placeholder="Search requests...">
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="empty-state" th:if="${requests.isEmpty()}">
                    <div class="empty-icon" style="font-size: 48px; margin-bottom: 16px;">🔄</div>
                    <h3>No Change Requests</h3>
                    <div class="empty-text">No pending timetable change requests.</div>
                </div>

                <div style="overflow-x: auto;" th:if="${!requests.isEmpty()}">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>Faculty</th>
                            <th>Target Class Slot</th>
                            <th>Type</th>
                            <th>Requested Change</th>
                            <th>Reason</th>
                            <th>Status</th>
                            <th>Admin Decision</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="cr : ${requests}">
                            <td>
                                <strong style="color: var(--primary);" th:text="${cr.requestedBy.fullName}">Prof. Name</strong>
                            </td>
                            <td>
                                <strong th:text="${cr.timetableEntry.dayOfWeek + ' Period ' + cr.timetableEntry.period.periodNumber}">Mon P1</strong><br>
                                <span class="text-muted" style="font-size: 12px;" th:text="${cr.timetableEntry.subject != null ? cr.timetableEntry.subject.name + ' (' + cr.timetableEntry.section.displayName + ')' : '-'}">Data Structures</span>
                            </td>
                            <td><span class="badge badge-published" th:text="${cr.changeType}">MODIFY</span></td>
                            <td th:text="${cr.requestedChanges}">Proposed Slot</td>
                            <td th:text="${cr.reason}">Reason</td>
                            <td>
                                <span th:if="${cr.status.name() == 'PENDING'}" class="badge badge-pending">Pending Review</span>
                                <span th:if="${cr.status.name() == 'APPROVED'}" class="badge badge-approved">Approved</span>
                                <span th:if="${cr.status.name() == 'REJECTED'}" class="badge badge-rejected">Rejected</span>
                            </td>
                            <td>
                                <div class="table-actions" th:if="${cr.status.name() == 'PENDING'}" style="display: flex; gap: 8px;">
                                    <form th:action="@{'/admin/timetable-requests/' + ${cr.id} + '/approve'}" method="post">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-primary btn-sm">✓ Approve</button>
                                    </form>
                                    <form th:action="@{'/admin/timetable-requests/' + ${cr.id} + '/reject'}" method="post">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-secondary btn-sm" style="background-color: #ef4444; color: white; border: none;">✗ Reject</button>
                                    </form>
                                </div>
                                <span th:if="${cr.status.name() != 'PENDING'}" th:text="${cr.adminComment != null ? cr.adminComment : '-'}">-</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/mobile.js}"></script>
</body>
</html>
