<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Forbidden | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body style="background-color: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh;">
<div class="card" style="text-align: center; max-width: 500px; padding: 40px;">
    <div style="font-size: 56px;">🚫</div>
    <h1 style="font-size: 28px; margin: 16px 0; color: var(--error);">403 - Access Forbidden</h1>
    <p class="text-muted" style="margin-bottom: 24px; line-height: 1.5;">
        You do not have permission to access the requested resource. Please make sure you are signed in with the correct role.
    </p>
    <a th:href="@{/}" class="btn btn-primary">Return to Homepage</a>
</div>
</body>
</html>
