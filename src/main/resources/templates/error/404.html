<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-role="admin" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="login-container">
    <div class="login-card" style="text-align: center;">
        <div style="font-size: 72px; font-weight: bold; color: var(--role-primary, var(--primary)); line-height: 1;">404</div>
        <h1 style="font-size: 24px; margin: 16px 0; color: var(--text);">Page Not Found</h1>
        <p class="text-muted" style="margin-bottom: 32px; line-height: 1.5;">
            The requested page or record could not be found. It may have been moved or deleted.
        </p>
        <a th:href="@{/}" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px; display: inline-block; box-sizing: border-box; text-decoration: none;">Go to Dashboard</a>
    </div>
</div>
</body>
</html>
