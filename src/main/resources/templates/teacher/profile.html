<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Profile | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar('profile')}"></aside>
    <main class="main-content">
        <header class="header" th:replace="~{fragments/header :: header('Teacher Profile')}"></header>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <div class="card profile-card" style="max-width: 650px;">
            <div class="card-header flex-between flex-center">
                <span class="card-title">👨‍🏫 Faculty Profile</span>
                <a th:href="@{/teacher/change-password}" class="btn btn-secondary btn-sm">🔑 Change Password</a>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px;">
                <div class="profile-field">
                    <div class="profile-label">Teacher / Employee ID</div>
                    <div class="profile-value" th:text="${teacher.teacherId}">T001</div>
                </div>
                <div class="profile-field">
                    <div class="profile-label">Full Name</div>
                    <div class="profile-value" th:text="${teacher.user.fullName}">Prof. Name</div>
                </div>
                <div class="profile-field">
                    <div class="profile-label">Email Address</div>
                    <div class="profile-value" th:text="${teacher.user.email != null ? teacher.user.email : 'N/A'}">email@smartschedule.edu</div>
                </div>
                <div class="profile-field">
                    <div class="profile-label">Phone Number</div>
                    <div class="profile-value" th:text="${teacher.phone != null ? teacher.phone : 'N/A'}">9876543210</div>
                </div>
                <div class="profile-field" style="grid-column: 1 / -1;">
                    <div class="profile-label">Associated Departments</div>
                    <div class="profile-value" style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px;">
                        <span th:each="d : ${teacher.departments}" class="badge badge-published" th:text="${d.name + ' (' + d.code + ')'}">CSE</span>
                    </div>
                </div>
                <div class="profile-field">
                    <div class="profile-label">Account Status</div>
                    <div class="profile-value"><span class="badge badge-active">Active Faculty</span></div>
                </div>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/mobile.js}"></script>
</body>
</html>
