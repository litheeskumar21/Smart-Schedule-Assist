<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable Change Requests | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar('change-requests')}"></aside>
    <main class="main-content">
        <header class="header" th:replace="~{fragments/header :: header('Change Requests')}"></header>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <!-- Request Form -->
        <div class="card mb-24">
            <div class="card-header">
                <span class="card-title">🔄 Request Timetable Slot Modification or Cancellation</span>
            </div>

            <form th:action="@{/teacher/change-request}" method="post" style="margin-top: 16px;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Select Assigned Class Slot *</label>
                        <select name="timetableEntryId" class="form-control form-select" required>
                            <option value="">-- Choose Class Slot --</option>
                            <option th:each="e : ${myEntries}" th:if="${e.subject != null}" th:value="${e.id}"
                                    th:text="${e.dayOfWeek + ' Period ' + e.period.periodNumber + ': ' + e.subject.name + ' (' + e.section.displayName + ')'}">Slot</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Request Type *</label>
                        <select name="changeType" class="form-control form-select" required>
                            <option value="MODIFY">Reschedule / Move to Different Time</option>
                            <option value="CANCEL">One-time Cancellation</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Requested Changes / Proposed Slot</label>
                        <input type="text" name="requestedChanges" class="form-control" placeholder="e.g., Move from Monday Period 1 to Tuesday Period 5">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Reason *</label>
                        <input type="text" name="reason" class="form-control" required placeholder="e.g., Lab equipment maintenance, guest lecture clash">
                    </div>
                </div>

                <div class="mt-16">
                    <button type="submit" class="btn btn-primary">Submit Change Request</button>
                </div>
            </form>
        </div>

        <!-- Past Change Requests -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">📋 My Change Requests History</span>
            </div>

            <div class="empty-state" th:if="${changeRequests.isEmpty()}">
                <div class="empty-icon">🔄</div>
                <div class="empty-text">No change requests submitted yet.</div>
            </div>

            <div style="overflow-x: auto; margin-top: 12px;" th:if="${!changeRequests.isEmpty()}">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>Class Slot</th>
                        <th>Type</th>
                        <th>Proposed Change</th>
                        <th>Reason</th>
                        <th>Status</th>
                        <th>Admin Comment</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cr : ${changeRequests}">
                        <td>
                            <strong th:text="${cr.timetableEntry.dayOfWeek + ' Period ' + cr.timetableEntry.period.periodNumber}">Mon P1</strong><br>
                            <span class="text-muted" style="font-size: 12px;" th:text="${cr.timetableEntry.subject != null ? cr.timetableEntry.subject.name + ' (' + cr.timetableEntry.section.displayName + ')' : '-'}">Data Structures</span>
                        </td>
                        <td><span class="badge badge-published" th:text="${cr.changeType}">MODIFY</span></td>
                        <td th:text="${cr.requestedChanges}">Proposed Slot</td>
                        <td th:text="${cr.reason}">Reason</td>
                        <td>
                            <span th:if="${cr.status.name() == 'PENDING'}" class="badge badge-pending">Pending Review</span>
                            <span th:if="${cr.status.name() == 'APPROVED'}" class="badge badge-approved">Approved</span>
                            <span th:if="${cr.status.name() == 'REJECTED'}" class="badge badge-rejected">Rejected</span>
                        </td>
                        <td th:text="${cr.adminComment != null ? cr.adminComment : '-'}">-</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/mobile.js}"></script>
</body>
</html>
