<!DOCTYPE html>
<html data-role="teacher" data-theme="light" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teacher Notifications | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-layout">
    <aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar('notifications')}"></aside>
    
    <main class="main-content">
        <header class="header" th:replace="~{fragments/header :: header('Notifications')}"></header>
        <div class="content-wrapper">

            <div class="page-header flex-between flex-center mb-24">
                <div>
                    <h1 class="page-title">Notification Center</h1>
                    <p class="page-subtitle">Stay updated with your latest alerts and announcements.</p>
                </div>
                <div class="page-header-actions">
                    <button onclick="markAllNotificationsAsRead()" class="btn btn-secondary btn-sm">✓ Mark All as Read</button>
                </div>
            </div>

            <div class="card" th:if="${notifications.isEmpty()}">
                <div class="empty-state">
                    <div class="empty-icon">🔔</div>
                    <div class="empty-text">You have no notifications at this time.</div>
                </div>
            </div>

            <div class="card" th:if="${!notifications.isEmpty()}" style="padding: 0; background: transparent; border: none;">
                <div th:each="n : ${notifications}"
                     class="announcement-card"
                     th:classappend="${!n.read} ? 'unread'"
                     th:onclick="'markNotificationRead(' + ${n.id} + ')'"
                     style="cursor: pointer;">
                    
                    <div class="announcement-meta">
                        <span class="announcement-tag" th:text="${n.type}">TYPE</span>
                        <span th:if="${!n.read}" class="badge badge-pending" style="font-size: 10px; padding: 2px 6px;">New</span>
                        <span class="announcement-date" style="margin-left: auto;" th:text="${#temporals.format(n.createdAt, 'MMM dd, yyyy hh:mm a')}">Date</span>
                    </div>
                    
                    <h3 class="announcement-title" th:text="${n.title}">Notification Title</h3>
                    <p class="announcement-body" th:text="${n.message}">Notification detailed message goes here.</p>
                </div>
            </div>
            
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a th:href="@{/teacher/dashboard}" class="bottom-nav-item">
            <div class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </div>
            <span>Home</span>
        </a>
        <a th:href="@{/teacher/timetable}" class="bottom-nav-item">
            <div class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </div>
            <span>Schedule</span>
        </a>
        <a th:href="@{/teacher/absence}" class="bottom-nav-item">
            <div class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </div>
            <span>Leaves</span>
        </a>
        <a th:href="@{/teacher/notifications}" class="bottom-nav-item active">
            <div class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </div>
            <span>Alerts</span>
        </a>
        <a th:href="@{/teacher/profile}" class="bottom-nav-item">
            <div class="bottom-nav-icon">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <span>Profile</span>
        </a>
    </nav>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/mobile.js}"></script>
<script>
    function markNotificationRead(id) {
        fetch('/api/notifications/' + id + '/read', {
            method: 'POST',
            headers: {
                'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]')?.content || ''
            }
        }).then(() => location.reload());
    }
    function markAllNotificationsAsRead() {
        fetch('/api/notifications/read-all', {
            method: 'POST',
            headers: {
                'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]')?.content || ''
            }
        }).then(() => location.reload());
    }
</script>
</body>
</html>
