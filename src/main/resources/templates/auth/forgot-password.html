<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="login-logo">
            📅 Smart Schedule Assist
        </div>
        <div class="login-title">Reset Password</div>

        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <p class="text-muted" style="font-size: 13px; margin-bottom: 20px; line-height: 1.5;">
            Enter your Username, Student ID, or Teacher ID. A password reset token will be generated.
        </p>

        <form th:action="@{/forgot-password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label class="form-label">Username / Student ID / Teacher ID</label>
                <input type="text" name="username" class="form-control" required autofocus placeholder="e.g., S001 or T001">
            </div>

            <div style="margin-top: 24px;">
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">Generate Reset Token</button>
            </div>
        </form>

        <div style="margin-top: 20px; text-align: center; font-size: 13px;">
            <a th:href="@{/login}" style="color: var(--primary); text-decoration: none;">← Back to Sign In</a>
        </div>
    </div>
</div>
</body>
</html>
