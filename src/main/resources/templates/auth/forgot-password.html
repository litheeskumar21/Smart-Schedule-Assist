<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <script>
        (function() {
            try {
                var t = localStorage.getItem('ssa-theme') || 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
</head>
<body class="login-page">

<div style="position: fixed; top: 20px; right: 20px; z-index: 1000;">
    <button id="themeToggleBtn" onclick="toggleTheme()" title="Toggle dark / light mode"
            style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
                   cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center;
                   color: var(--text-muted); width: 42px; height: 42px; box-shadow: var(--shadow-md);
                   transition: all 0.2s ease;">
        <svg id="iconSun" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.75" fill="none" style="display:block;">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg id="iconMoon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.75" fill="none" style="display:none;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
    </button>
</div>

<div class="login-card">
    <div class="login-header" style="text-align: center; margin-bottom: 24px;">
        <svg class="login-logo" style="width: 48px; height: 48px; margin-bottom: 16px; color: var(--role-primary, var(--primary));" viewBox="0 0 24 24" stroke-width="1.75" fill="none" stroke="currentColor">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <h2 style="font-size: 24px; font-weight: 700; color: var(--text);">Reset Password</h2>
    </div>

    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <p class="text-muted" style="font-size: 13px; margin-bottom: 20px; line-height: 1.5; text-align: center;">
        Enter your Username, Student ID, or Teacher ID. A password reset token will be generated.
    </p>

    <form th:action="@{/forgot-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group" style="margin-bottom: 16px;">
            <label class="form-label" style="font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; display: block;">Username / ID</label>
            <input type="text" name="username" class="form-control" required autofocus placeholder="e.g., S001 or T001"
                   style="width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 15px; outline: none; background: var(--surface); color: var(--text);">
        </div>

        <div style="margin-top: 24px;">
            <button type="submit" class="btn btn-primary" style="width: 100%; border-radius: 9999px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; color: white;">Generate Reset Token</button>
        </div>
    </form>

    <div style="margin-top: 20px; text-align: center; font-size: 13px;">
        <a th:href="@{/login}" style="color: var(--role-primary, var(--primary)); text-decoration: none; font-weight: 500;">← Back to Sign In</a>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
