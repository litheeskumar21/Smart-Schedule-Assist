<!DOCTYPE html>
<html data-role="student" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Smart Schedule Assist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <script>
        (function() {
            try {
                var t = localStorage.getItem('ssa-theme') || 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
</head>
<body class="login-page">

    <!-- Theme Toggle (Dark / Bright mode) -->
    <div style="position: fixed; top: 20px; right: 20px; z-index: 1000;">
        <button id="themeToggleBtn" onclick="toggleTheme()" title="Toggle dark / light mode"
                style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
                       cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center;
                       color: var(--text-muted); width: 42px; height: 42px; box-shadow: var(--shadow-md);
                       transition: all 0.2s ease;">
            <!-- Sun icon: visible in light mode -->
            <svg id="iconSun" viewBox="0 0 24 24" width="20" height="20"
                 stroke="currentColor" stroke-width="1.75" fill="none" style="display:block;">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1"    x2="12" y2="3"/>
                <line x1="12" y1="21"   x2="12" y2="23"/>
                <line x1="4.22"  y1="4.22"   x2="5.64"  y2="5.64"/>
                <line x1="18.36" y1="18.36"  x2="19.78" y2="19.78"/>
                <line x1="1"  y1="12" x2="3"  y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22"  y1="19.78" x2="5.64"  y2="18.36"/>
                <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"/>
            </svg>
            <!-- Moon icon: visible in dark mode -->
            <svg id="iconMoon" viewBox="0 0 24 24" width="20" height="20"
                 stroke="currentColor" stroke-width="1.75" fill="none" style="display:none;">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>
    </div>

    <div class="login-card">
        <div class="login-header" style="text-align: center; margin-bottom: 24px;">
            <svg class="login-logo" style="width: 48px; height: 48px; margin-bottom: 16px; color: var(--role-primary, var(--primary));" viewBox="0 0 24 24" stroke-width="1.75" fill="none" stroke="currentColor">
                <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <h2 style="font-size: 24px; font-weight: 700;">Sign In to Your Account</h2>
        </div>
        
        <div class="role-selector" style="display: flex; position: relative; background: var(--surface-2); border: 1px solid var(--border); border-radius: 99px; padding: 4px; margin-bottom: 24px;">
            <div class="role-selector-slider" style="position: absolute; left: 4px; top: 4px; bottom: 4px; width: calc(33.333% - 8px/3); background: var(--role-primary, #14b8a6); border-radius: 99px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);"></div>
            <button type="button" class="role-btn active" data-role="student" style="flex: 1; border: none; background: transparent; padding: 8px; font-weight: 600; font-size: 14px; position: relative; z-index: 1; cursor: pointer; color: white; transition: color 0.2s;">Student</button>
            <button type="button" class="role-btn" data-role="teacher" style="flex: 1; border: none; background: transparent; padding: 8px; font-weight: 600; font-size: 14px; position: relative; z-index: 1; cursor: pointer; color: var(--text-muted); transition: color 0.2s;">Teacher</button>
            <button type="button" class="role-btn" data-role="admin" style="flex: 1; border: none; background: transparent; padding: 8px; font-weight: 600; font-size: 14px; position: relative; z-index: 1; cursor: pointer; color: var(--text-muted); transition: color 0.2s;">Admin</button>
        </div>

        <div th:if="${errorMessage}" class="alert alert-error" style="padding: 12px 16px; border-radius: 8px; background: #fef2f2; color: #b91c1c; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; font-size: 13.5px; border-left: 4px solid #ef4444;">
            <svg style="width: 18px; height: 18px; flex-shrink: 0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span th:text="${errorMessage}">Invalid credentials.</span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success" style="padding: 12px 16px; border-radius: 8px; background: #f0fdf4; color: #15803d; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; font-size: 13.5px; border-left: 4px solid #22c55e;">
            <svg style="width: 18px; height: 18px; flex-shrink: 0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            <span th:text="${successMessage}">Logged out successfully.</span>
        </div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="role" id="selectedRoleInput" value="student"/>
            
            <div class="form-floating" style="position: relative; margin-bottom: 16px;">
                <input type="text" name="username" class="form-control" id="floatingUsername" required autofocus placeholder=" " style="width: 100%; padding: 24px 16px 8px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 15px; outline: none; transition: border-color 0.2s; background: var(--surface); color: var(--text);">
                <label for="floatingUsername" id="floatingUsernameLabel" style="position: absolute; left: 16px; top: 16px; font-size: 14px; color: var(--text-muted); pointer-events: none; transition: 0.2s;">Student ID / Username</label>
            </div>
            
            <div class="form-floating password-wrapper" style="position: relative; margin-bottom: 16px;">
                <input type="password" name="password" class="form-control" id="floatingPassword" required placeholder=" " style="width: 100%; padding: 24px 48px 8px 16px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 15px; outline: none; transition: border-color 0.2s; background: var(--surface); color: var(--text);">
                <label for="floatingPassword" style="position: absolute; left: 16px; top: 16px; font-size: 14px; color: var(--text-muted); pointer-events: none; transition: 0.2s;">Password</label>
                <button type="button" id="passwordToggleBtn" onclick="togglePassword()" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 4px; color: var(--text-muted); display: flex; align-items: center; transition: color 0.2s;" title="Show/hide password">
                    <!-- eye-off: shown when password is hidden (default) -->
                    <svg id="iconEyeOff" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                    <!-- eye: shown when password is visible -->
                    <svg id="iconEye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <div class="form-options" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 13.5px;">
                <label class="remember-me" style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-muted);">
                    <input type="checkbox" name="remember-me" style="accent-color: var(--role-primary, #14b8a6);"> Remember me
                </label>
                <a th:href="@{/forgot-password}" class="forgot-link" style="color: var(--role-primary, #14b8a6); text-decoration: none; font-weight: 500;">Forgot password?</a>
            </div>
            
            <button type="submit" class="btn btn-primary btn-lg w-full" style="width: 100%; border-radius: 9999px; padding: 12px; font-size: 16px; font-weight: 600; cursor: pointer; background-color: var(--role-primary, #14b8a6); border: none; color: white; transition: background 0.2s;">Sign In</button>
        </form>

        <div class="demo-credentials" style="margin-top: 24px; padding: 14px; background-color: var(--surface-2); border-radius: 12px; border: 1px dashed var(--border); font-size: 13px; line-height: 1.6; color: var(--text-muted);">
            <div style="font-weight: 700; margin-bottom: 4px; color: var(--text);">🔑 Demo Credentials:</div>
            <div><strong>Student:</strong> S001 / student123</div>
            <div><strong>Teacher:</strong> T001 / teacher123</div>
            <div><strong>Admin:</strong> admin / admin123</div>
        </div>
        
        <div class="login-footer" style="text-align: center; margin-top: 24px; font-size: 13px; color: #94a3b8;">
            &copy; 2026 Smart Schedule Assist
        </div>
    </div>
    
    <script th:src="@{/js/app.js}"></script>
    <script>
        function togglePassword() {
            const pwd     = document.getElementById('floatingPassword');
            const eyeOff  = document.getElementById('iconEyeOff');
            const eye     = document.getElementById('iconEye');
            const btn     = document.getElementById('passwordToggleBtn');

            const isHidden = pwd.type === 'password';
            pwd.type = isHidden ? 'text' : 'password';

            // Show open-eye when visible, closed-eye (eye-off) when hidden
            eyeOff.style.display = isHidden ? 'none'  : 'block';
            eye.style.display    = isHidden ? 'block' : 'none';

            // Tint the icon to match the active role colour when revealed
            btn.style.color = isHidden ? 'var(--role-primary, #14b8a6)' : '#94a3b8';
        }

        const roleLabels = {
            student: { label: 'Student ID / Username', placeholder: 'e.g., S001', color: '#14b8a6' },
            teacher: { label: 'Teacher ID / Username', placeholder: 'e.g., T001', color: '#f59e0b' },
            admin:   { label: 'Admin Username',         placeholder: 'e.g., admin', color: '#f97316' }
        };

        function selectRole(role, animateSlider) {
            const btn = document.querySelector(`.role-btn[data-role="${role}"]`);
            if (!btn) return;
            
            document.querySelectorAll('.role-btn').forEach(b => {
                b.classList.remove('active');
                b.style.color = 'var(--text-muted)';
            });
            btn.classList.add('active');
            btn.style.color = 'white';
            
            const btns = Array.from(document.querySelectorAll('.role-btn'));
            const index = btns.indexOf(btn);
            const slider = document.querySelector('.role-selector-slider');
            if (slider) {
                slider.style.left = `calc(4px + (100% - 8px) / 3 * ${index})`;
                slider.style.background = roleLabels[role]?.color || '#14b8a6';
            }
            
            document.documentElement.setAttribute('data-role', role);
            
            const hiddenRoleInput = document.getElementById('selectedRoleInput');
            if (hiddenRoleInput) hiddenRoleInput.value = role;
            
            const usernameLabel = document.getElementById('floatingUsernameLabel');
            if (usernameLabel && roleLabels[role]) {
                usernameLabel.textContent = roleLabels[role].label;
            }
            
            try {
                localStorage.setItem('ssa-login-role', role);
            } catch (e) {}
        }

        document.querySelectorAll('.role-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                selectRole(e.currentTarget.dataset.role, true);
            });
        });

        // Initialize role from localStorage if previously selected
        document.addEventListener('DOMContentLoaded', () => {
            let savedRole = 'student';
            try {
                savedRole = localStorage.getItem('ssa-login-role') || 'student';
            } catch (e) {}
            selectRole(savedRole, false);
        });
        
        // Floating label adjustment
        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('focus', () => {
                input.nextElementSibling.style.top = '6px';
                input.nextElementSibling.style.fontSize = '11px';
            });
            input.addEventListener('blur', () => {
                if (!input.value) {
                    input.nextElementSibling.style.top = '16px';
                    input.nextElementSibling.style.fontSize = '14px';
                }
            });
            if (input.value) {
                input.nextElementSibling.style.top = '6px';
                input.nextElementSibling.style.fontSize = '11px';
            }
        });
    </script>
</body>
</html>
