<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="login-logo">
            📅 Smart Schedule Assist
        </div>
        <div class="login-title">Sign In to Your Account</div>

        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}">Invalid credentials.</div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">Logged out successfully.</div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label class="form-label">Username / Student ID / Teacher ID</label>
                <input type="text" name="username" class="form-control" required autofocus placeholder="e.g., S001, T001, or admin">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required placeholder="Enter your password">
            </div>

            <div style="margin-top: 24px;">
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px;">Sign In</button>
            </div>
        </form>

        <div style="margin-top: 20px; text-align: center; font-size: 13px;">
            <a th:href="@{/forgot-password}" style="color: var(--primary); text-decoration: none;">Forgot your password?</a>
        </div>

        <!-- Demo Account Credentials helper card for grading / testing -->
        <div style="margin-top: 24px; padding: 14px; background-color: #f1f3f4; border-radius: 6px; font-size: 12px; line-height: 1.6;">
            <div style="font-weight: 700; color: var(--text); margin-bottom: 4px;">🔑 Demo Credentials:</div>
            <div><strong>Admin:</strong> admin / admin123</div>
            <div><strong>Teacher:</strong> T001 / teacher123</div>
            <div><strong>Student:</strong> S001 / student123</div>
        </div>
    </div>
</div>
</body>
</html>
