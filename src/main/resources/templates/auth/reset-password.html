<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="login-logo">
            📅 Smart Schedule Assist
        </div>
        <div class="login-title">Choose New Password</div>

        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <p class="text-muted" style="font-size: 13px; margin-bottom: 20px;">
            Account: <strong th:text="${user != null ? user.fullName + ' (' + user.username + ')' : 'Your Account'}">User</strong>
        </p>

        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="token" th:value="${token}"/>

            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" name="newPassword" class="form-control" required minlength="4" placeholder="Enter new password">
            </div>

            <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <input type="password" name="confirmPassword" class="form-control" required minlength="4" placeholder="Re-enter new password">
            </div>

            <div style="margin-top: 24px;">
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">Reset Password</button>
            </div>
        </form>

        <div style="margin-top: 20px; text-align: center; font-size: 13px;">
            <a th:href="@{/login}" style="color: var(--primary); text-decoration: none;">← Back to Sign In</a>
        </div>
    </div>
</div>
</body>
</html>
