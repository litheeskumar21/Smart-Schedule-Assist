<header class="header" th:fragment="header(pageTitle)"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

  <meta th:name="_csrf" th:content="${_csrf.token}"/>
  <script>
    (function() {
      try {
        var t = localStorage.getItem('ssa-theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <!-- Left: animated sidebar toggle + title/greeting -->
  <div style="display:flex;align-items:center;gap:14px;">
    <button class="sidebar-toggle-btn"
            id="sidebarToggleBtn"
            onclick="toggleSidebar()"
            title="Toggle Menu"
            aria-label="Toggle Menu"
            type="button">
      <span class="hamburger-box">
        <span class="hamburger-line line-1"></span>
        <span class="hamburger-line line-2"></span>
        <span class="hamburger-line line-3"></span>
      </span>
    </button>

    <div>
      <h1 class="header-title" th:text="${pageTitle}"
          style="font-size:18px;font-weight:700;margin:0;color:var(--text);">Page Title</h1>
      <div style="display:flex;align-items:center;gap:6px;margin-top:2px;">
        <span id="greetingText" data-name th:attr="data-name=${#authentication.name}"
              style="font-size:13px;color:var(--text-muted);">Good morning,</span>
        <span id="headerDate" style="font-size:13px;color:var(--text-muted);font-weight:500;"></span>
      </div>
    </div>
  </div>

  <!-- Right: dark-mode toggle, notification bell, user avatar -->
  <div style="display:flex;align-items:center;gap:10px;">

    <!-- ── Dark Mode Toggle ── -->
    <button id="themeToggleBtn"
            onclick="toggleTheme()"
            title="Toggle dark / light mode"
            type="button"
            style="background:none;border:1px solid var(--border);border-radius:10px;
                   cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;
                   color:var(--text-muted);width:38px;height:38px;transition:background 0.2s,color 0.2s,border-color 0.2s;
                   flex-shrink:0;">
      <!-- Sun icon: visible in light mode -->
      <svg id="iconSun" viewBox="0 0 24 24" width="18" height="18"
           stroke="currentColor" stroke-width="1.75" fill="none" style="display:block;">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1"    x2="12" y2="3"/>
        <line x1="12" y1="21"   x2="12" y2="23"/>
        <line x1="4.22"  y1="4.22"   x2="5.64"  y2="5.64"/>
        <line x1="18.36" y1="18.36"  x2="19.78" y2="19.78"/>
        <line x1="1"  y1="12" x2="3"  y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22"  y1="19.78" x2="5.64"  y2="18.36"/>
        <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"/>
      </svg>
      <!-- Moon icon: visible in dark mode -->
      <svg id="iconMoon" viewBox="0 0 24 24" width="18" height="18"
           stroke="currentColor" stroke-width="1.75" fill="none" style="display:none;">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>

    <!-- ── Notification Bell ── -->
    <div class="notif-bell-wrap" style="position:relative;">
      <button class="notification-bell"
              onclick="toggleNotificationDropdown()"
              title="Notifications"
              type="button"
              style="background:none;border:1px solid var(--border);border-radius:10px;
                     cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;
                     color:var(--text-muted);width:38px;height:38px;position:relative;
                     transition:background 0.2s,color 0.2s,border-color 0.2s;flex-shrink:0;">
        <svg viewBox="0 0 24 24" width="18" height="18"
             stroke="currentColor" stroke-width="1.75" fill="none">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <!-- Unread badge -->
        <span style="position:absolute;top:-4px;right:-4px;background:#ef4444;color:white;
                     font-size:9px;font-weight:700;min-width:17px;height:17px;border-radius:999px;
                     display:flex;align-items:center;justify-content:center;padding:0 4px;
                     border:2px solid var(--surface);"
              th:if="${unreadCount != null and unreadCount > 0}"
              th:text="${unreadCount}">0</span>
      </button>

      <!-- Notification Dropdown -->
      <div id="notificationDropdown"
           style="display:none;position:absolute;right:0;top:calc(100% + 10px);
                  width:340px;background:var(--surface);border:1px solid var(--border);
                  border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,0.14);
                  z-index:1100;overflow:hidden;">

        <div style="padding:14px 16px;border-bottom:1px solid var(--border);
                    display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:14px;font-weight:600;color:var(--text);">Notifications</span>
          <button onclick="markAllRead()"
                  type="button"
                  style="font-size:12px;color:var(--role-primary,#14b8a6);background:none;
                         border:none;cursor:pointer;font-weight:500;padding:0;">
            Mark all read
          </button>
        </div>

        <div id="notificationList" style="max-height:320px;overflow-y:auto;"></div>

        <div style="padding:10px 16px;border-top:1px solid var(--border);text-align:center;">
          <a th:href="@{/student/notifications}" sec:authorize="hasRole('STUDENT')"
             style="font-size:13px;font-weight:500;color:var(--role-primary,#14b8a6);text-decoration:none;">
            View all notifications
          </a>
          <a th:href="@{/teacher/notifications}" sec:authorize="hasRole('TEACHER')"
             style="font-size:13px;font-weight:500;color:var(--role-primary,#f59e0b);text-decoration:none;">
            View all notifications
          </a>
          <a th:href="@{/admin/notifications}" sec:authorize="hasRole('ADMIN')"
             style="font-size:13px;font-weight:500;color:var(--role-primary,#f97316);text-decoration:none;">
            View all notifications
          </a>
        </div>
      </div>
    </div>

    <!-- ── User Avatar & Dropdown ── -->
    <div class="user-avatar-wrap" style="position:relative;">
      <button onclick="toggleProfileDropdown()"
              title="Profile & Account"
              id="headerUserAvatarBtn"
              type="button"
              style="background:var(--role-primary,#14b8a6);border:none;cursor:pointer;
                     width:36px;height:36px;border-radius:10px;color:white;
                     display:flex;align-items:center;justify-content:center;
                     font-size:13px;font-weight:700;transition:all 0.2s;flex-shrink:0;">
        <span sec:authentication="name"
              th:text="${#authentication.name != null ? #authentication.name.substring(0,1).toUpperCase() : 'U'}">U</span>
      </button>

      <!-- Profile Dropdown in Header -->
      <div id="profileDropdown"
           style="display:none;position:absolute;right:0;top:calc(100% + 10px);
                  width:220px;background:var(--surface);border:1px solid var(--border);
                  border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,0.15);
                  z-index:1100;overflow:hidden;padding:6px;">
        <div style="padding:10px 12px;border-bottom:1px solid var(--border);margin-bottom:4px;">
          <div style="font-weight:600;font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" sec:authentication="name">User</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:2px;" sec:authentication="authorities">Role</div>
        </div>
        <a th:href="@{/student/profile}" sec:authorize="hasRole('STUDENT')" class="profile-dropdown-item" style="display:flex;align-items:center;gap:8px;padding:8px 12px;text-decoration:none;color:var(--text);border-radius:8px;font-size:13.5px;transition:background 0.15s;">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> View Profile
        </a>
        <a th:href="@{/teacher/profile}" sec:authorize="hasRole('TEACHER')" class="profile-dropdown-item" style="display:flex;align-items:center;gap:8px;padding:8px 12px;text-decoration:none;color:var(--text);border-radius:8px;font-size:13.5px;transition:background 0.15s;">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> View Profile
        </a>
        <a th:href="@{/admin/settings}" sec:authorize="hasRole('ADMIN')" class="profile-dropdown-item" style="display:flex;align-items:center;gap:8px;padding:8px 12px;text-decoration:none;color:var(--text);border-radius:8px;font-size:13.5px;transition:background 0.15s;">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> System Settings
        </a>
        <div style="height:1px;background:var(--border);margin:4px 0;"></div>
        <form th:action="@{/logout}" method="post" style="margin:0;">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="profile-dropdown-item" style="width:100%;display:flex;align-items:center;gap:8px;padding:8px 12px;background:none;border:none;color:#ef4444;cursor:pointer;border-radius:8px;font-size:13.5px;font-weight:500;">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout
          </button>
        </form>
      </div>
    </div>

  </div>

  <style>
    .header {
      position: sticky;
      top: 0;
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 64px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      transition: background 0.22s ease, border-color 0.22s ease;
    }
    #themeToggleBtn:hover,
    .notification-bell:hover {
      background: var(--surface-2) !important;
      color: var(--text) !important;
    }
    .profile-dropdown-item:hover {
      background: var(--surface-2) !important;
    }
    @media (max-width: 768px) {
      .header { padding: 0 16px; }
      #headerDate { display: none !important; }
    }
  </style>

</header>
