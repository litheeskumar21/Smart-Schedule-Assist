<header class="header" th:fragment="header(pageTitle)" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" style="display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: white; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 10;">
  <meta th:name="_csrf" th:content="${_csrf.token}"/>
  
  <div style="display: flex; align-items: center; gap: 16px;">
    <button class="mobile-menu-btn" onclick="toggleSidebar()" style="background: none; border: none; cursor: pointer; display: none; padding: 8px; border-radius: 8px;">
      <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    
    <div>
      <h1 class="header-title" th:text="${pageTitle}" style="font-size: 20px; font-weight: 700; margin: 0; color: var(--text);">Page Title</h1>
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
        <div id="greetingText" data-name th:attr="data-name=${#authentication.name}" style="font-size: 14px; color: var(--text-muted);">Good morning,</div>
        <div id="headerDate" style="font-size: 14px; color: var(--text-muted); font-weight: 500;"></div>
      </div>
    </div>
  </div>

  <div class="header-right" style="display: flex; align-items: center; gap: 16px;">
    <button id="themeToggleBtn" onclick="toggleTheme()" style="background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 8px; border-radius: 50%;">
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
    
    <div style="position: relative;">
      <button class="notification-bell" onclick="toggleNotificationDropdown()" style="background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 8px; border-radius: 50%; position: relative;">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="notification-badge" th:text="${unreadCount}" th:if="${unreadCount != null && unreadCount > 0}" style="position: absolute; top: 4px; right: 4px; background: #ef4444; color: white; font-size: 10px; font-weight: bold; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">0</span>
      </button>
      
      <div class="notification-dropdown" id="notificationDropdown" style="display:none; position: absolute; right: 0; top: 100%; margin-top: 8px; width: 320px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; z-index: 50;">
        <div style="padding: 16px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
          <h3 style="margin: 0; font-size: 16px; font-weight: 600;">Notifications</h3>
          <a href="#" style="font-size: 12px; color: var(--primary); text-decoration: none;">Mark all as read</a>
        </div>
        <div style="max-height: 300px; overflow-y: auto;">
          <!-- Populated by JS -->
          <div style="padding: 16px; text-align: center; color: var(--text-muted); font-size: 14px;">No new notifications</div>
        </div>
      </div>
    </div>
    
    <button class="avatar-btn" onclick="toggleProfileDropdown()" style="display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 4px; border-radius: 20px; border: 1px solid transparent;">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600;">
        <span sec:authentication="name" style="text-transform: uppercase;">U</span>
      </div>
    </button>
  </div>
  
  <style>
    @media (max-width: 768px) {
      .mobile-menu-btn { display: block !important; }
    }
  </style>
</header>
