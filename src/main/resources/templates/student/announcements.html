<!DOCTYPE html>
<html data-role="student" data-theme="light" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="sidebar-overlay"></div>
<aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar('announcements')}"></aside>
<div class="app-layout">
    <main class="main-content">
        <header class="header" th:replace="~{fragments/header :: header('Announcements')}"></header>

        <div class="page-header" style="margin-bottom:20px;">
            <h1 class="page-title" style="margin:0;">Announcements</h1>
        </div>

        <div class="empty-state card" th:if="${announcements.isEmpty()}">
            <div class="empty-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </div>
            <div class="empty-text">No active announcements available.</div>
        </div>

        <div class="announcement-list" th:if="${!announcements.isEmpty()}">
            <div th:each="a : ${announcements}" class="card announcement-card mb-16" style="margin-bottom:16px;">
                <div class="flex-between flex-center mb-12" style="display:flex; justify-content:space-between; margin-bottom:12px;">
                    <h3 class="announcement-title" style="margin:0;" th:text="${a.title}">Title</h3>
                    <span class="announcement-date text-muted" th:text="${#temporals.format(a.publishedAt != null ? a.publishedAt : a.createdAt, 'MMM dd, yyyy HH:mm')}">Date</span>
                </div>
                <p class="announcement-content text-body mb-16" style="white-space: pre-line; margin-bottom:16px;" th:text="${a.content}">Content</p>
                <div class="flex-between flex-center" style="display:flex; justify-content:space-between;">
                    <span class="badge badge-active" th:text="${a.targetType}">Target</span>
                    <span class="text-muted" style="font-size: 13px;">By <strong th:text="${a.createdBy != null ? a.createdBy.fullName : 'Admin'}">Admin</strong></span>
                </div>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/mobile.js}"></script>
</body>
</html>
