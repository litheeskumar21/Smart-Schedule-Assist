<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar('announcements')}"></aside>
    <main class="main-content">
        <header class="header" th:replace="~{fragments/header :: header('Announcements')}"></header>

        <h1 class="page-title">📢 Official Announcements</h1>

        <div class="card" th:if="${announcements.isEmpty()}">
            <div class="empty-state">
                <div class="empty-icon">📢</div>
                <div class="empty-text">No active announcements available.</div>
            </div>
        </div>

        <div th:each="a : ${announcements}" class="card announcement-card mb-16">
            <div class="flex-between flex-center">
                <h3 class="announcement-title" th:text="${a.title}">Announcement Title</h3>
                <span class="announcement-date" th:text="${#temporals.format(a.publishedAt != null ? a.publishedAt : a.createdAt, 'MMM dd, yyyy hh:mm a')}">Date</span>
            </div>
            <p class="announcement-content" style="white-space: pre-line; line-height: 1.6;" th:text="${a.content}">Content</p>
            <div class="mt-8 flex-between flex-center">
                <span class="badge badge-published" th:text="${a.targetType}">TARGET</span>
                <span class="text-muted" style="font-size: 12px;">By: <strong th:text="${a.createdBy != null ? a.createdBy.fullName : 'Admin'}">Admin</strong></span>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/mobile.js}"></script>
</body>
</html>
