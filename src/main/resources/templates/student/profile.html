<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar('profile')}"></aside>
    <main class="main-content">
        <header class="header" th:replace="~{fragments/header :: header('Student Profile')}"></header>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <div class="card profile-card" style="max-width: 650px;">
            <div class="card-header flex-between flex-center">
                <span class="card-title">👤 Student Profile</span>
                <a th:href="@{/student/change-password}" class="btn btn-secondary btn-sm">🔑 Change Password</a>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px;">
                <div class="profile-field">
                    <div class="profile-label">Student ID / Roll No</div>
                    <div class="profile-value" th:text="${student.studentId}">S001</div>
                </div>
                <div class="profile-field">
                    <div class="profile-label">Full Name</div>
                    <div class="profile-value" th:text="${student.user.fullName}">Student Name</div>
                </div>
                <div class="profile-field">
                    <div class="profile-label">Email Address</div>
                    <div class="profile-value" th:text="${student.user.email != null ? student.user.email : 'N/A'}">email@smartschedule.edu</div>
                </div>
                <div class="profile-field">
                    <div class="profile-label">Department</div>
                    <div class="profile-value" th:text="${student.department != null ? student.department.name : 'N/A'}">CSE</div>
                </div>
                <div class="profile-field">
                    <div class="profile-label">Academic Year</div>
                    <div class="profile-value" th:text="${student.academicYear != null ? student.academicYear.label : 'N/A'}">2nd Year</div>
                </div>
                <div class="profile-field">
                    <div class="profile-label">Section</div>
                    <div class="profile-value" th:text="${student.section != null ? student.section.displayName : 'N/A'}">CSE-A</div>
                </div>
                <div class="profile-field">
                    <div class="profile-label">Current Semester</div>
                    <div class="profile-value" th:text="${student.semester}">3</div>
                </div>
                <div class="profile-field">
                    <div class="profile-label">Account Status</div>
                    <div class="profile-value"><span class="badge badge-active">Active</span></div>
                </div>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/mobile.js}"></script>
</body>
</html>
