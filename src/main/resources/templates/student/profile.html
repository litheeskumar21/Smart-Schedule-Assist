<!DOCTYPE html>
<html data-role="student" data-theme="light" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="sidebar-overlay"></div>
<div class="app-layout">
    <aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar('profile')}"></aside>
    <main class="main-content">
        <header class="header" th:replace="~{fragments/header :: header('Student Profile')}"></header>
        <div class="content-wrapper">

        <div th:if="${successMessage}" class="alert alert-success mb-16" style="margin-bottom:16px;" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error mb-16" style="margin-bottom:16px;" th:text="${errorMessage}"></div>

        <div class="card profile-card mx-auto" style="max-width: 700px; margin:0 auto;">
            <div class="profile-header text-center mb-24" style="text-align:center; margin-bottom:24px;">
                <div class="avatar-circle mx-auto mb-16" style="width: 80px; height: 80px; background-color: var(--role-primary, var(--primary)); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 600; margin:0 auto 16px auto;">
                    <span th:text="${#strings.substring(student.user.fullName, 0, 1)}">S</span>
                </div>
                <h2 style="margin:0; color: var(--text);" th:text="${student.user.fullName}">Name</h2>
                <p class="text-muted mt-4" style="margin-top:4px;" th:text="${student.studentId}">ID</p>
            </div>
            
            <div class="grid grid-2 gap-16 mb-24" style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px;">
                <div class="info-card">
                    <div class="info-label">Email</div>
                    <div class="info-value" th:text="${student.user.email != null ? student.user.email : 'N/A'}">Email</div>
                </div>
                <div class="info-card">
                    <div class="info-label">Department</div>
                    <div class="info-value" th:text="${student.department != null ? student.department.name : 'N/A'}">Dept</div>
                </div>
                <div class="info-card">
                    <div class="info-label">Year & Section</div>
                    <div class="info-value">
                        <span th:text="${student.academicYear != null ? student.academicYear.label : 'N/A'}">Year</span> - 
                        <span th:text="${student.section != null ? student.section.displayName : 'N/A'}">Section</span>
                    </div>
                </div>
                <div class="info-card">
                    <div class="info-label">Semester</div>
                    <div class="info-value" th:text="${student.semester}">Sem</div>
                </div>
            </div>

            <div style="text-align:center;">
                <a th:href="@{/student/change-password}" class="btn btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    Change Password
                </a>
            </div>
        </div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/mobile.js}"></script>
</body>
</html>
