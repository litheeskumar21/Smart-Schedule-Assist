<!DOCTYPE html>
<html data-role="student" data-theme="light" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="sidebar-overlay"></div>
<aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar('profile')}"></aside>
<div class="app-layout">
    <main class="main-content">
        <header class="header" th:replace="~{fragments/header :: header('Change Password')}"></header>

        <div th:if="${errorMessage}" class="alert alert-error mb-16" style="margin-bottom:16px;" th:text="${errorMessage}"></div>

        <div class="card mx-auto" style="max-width: 500px; margin:0 auto;">
            <div class="card-header mb-20" style="margin-bottom:20px;">
                <h2 class="card-title" style="margin:0;">Change Password</h2>
            </div>

            <form th:action="@{/student/change-password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group mb-16" style="margin-bottom:16px;">
                    <label class="form-label" style="display:block; margin-bottom:8px; font-weight:500;">Current Password</label>
                    <input type="password" name="currentPassword" class="form-control" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:4px;" required placeholder="Enter current password">
                </div>

                <div class="form-group mb-16" style="margin-bottom:16px;">
                    <label class="form-label" style="display:block; margin-bottom:8px; font-weight:500;">New Password</label>
                    <input type="password" name="newPassword" class="form-control" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:4px;" required minlength="4" placeholder="Enter new password">
                </div>

                <div class="form-group mb-24" style="margin-bottom:24px;">
                    <label class="form-label" style="display:block; margin-bottom:8px; font-weight:500;">Confirm New Password</label>
                    <input type="password" name="confirmPassword" class="form-control" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:4px;" required minlength="4" placeholder="Re-enter new password">
                </div>

                <div class="flex gap-12" style="display:flex; gap:12px;">
                    <button type="submit" class="btn btn-primary">Update Password</button>
                    <a th:href="@{/student/profile}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/mobile.js}"></script>
</body>
</html>
