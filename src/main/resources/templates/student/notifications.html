<!DOCTYPE html>
<html data-role="student" data-theme="light" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="sidebar-overlay"></div>
<aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar('notifications')}"></aside>
<div class="app-layout">
    <main class="main-content">
        <header class="header" th:replace="~{fragments/header :: header('Notifications')}"></header>
        <div class="content-wrapper">

        <div class="page-header flex-between flex-center" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h1 class="page-title" style="margin:0;">Notifications</h1>
            <button onclick="markAllNotificationsAsRead()" class="btn btn-secondary btn-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                Mark All as Read
            </button>
        </div>

        <div class="filter-chips mb-20" style="margin-bottom:20px; display:flex; gap:10px;">
            <label class="chip">
                <input type="radio" name="notif-filter" value="all" checked onchange="filterNotifications('all')">
                <span>All</span>
            </label>
            <label class="chip">
                <input type="radio" name="notif-filter" value="unread" onchange="filterNotifications('unread')">
                <span>Unread</span>
            </label>
        </div>

        <div class="empty-state card" th:if="${notifications.isEmpty()}">
            <div class="empty-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </div>
            <div class="empty-text">You have no notifications at this time.</div>
        </div>

        <div class="notification-list" th:if="${!notifications.isEmpty()}">
            <div th:each="n : ${notifications}"
                 class="notification-item card mb-12"
                 th:classappend="${!n.read} ? 'unread'"
                 th:data-status="${n.read ? 'read' : 'unread'}"
                 th:onclick="'markNotificationRead(' + ${n.id} + ')'"
                 style="cursor: pointer; margin-bottom:12px;">
                <div class="flex-between flex-center" style="display:flex; justify-content:space-between;">
                    <h3 class="notification-title" style="margin:0; font-size:16px;" th:text="${n.title}">Notification Title</h3>
                    <span class="notification-time text-muted" th:text="${#temporals.format(n.createdAt, 'MMM dd, yyyy HH:mm')}">Date</span>
                </div>
                <p class="notification-message text-muted" style="margin:8px 0 12px 0;" th:text="${n.message}">Message</p>
                <div class="flex-center" style="display:flex; gap: 8px; align-items:center;">
                    <span class="badge badge-published" th:text="${n.type}">TYPE</span>
                    <span th:if="${!n.read}" class="badge badge-pending">Unread</span>
                </div>
            </div>
        </div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/mobile.js}"></script>
<script>
    function markNotificationRead(id) {
        fetch('/api/notifications/' + id + '/read', {
            method: 'POST',
            headers: {
                'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]')?.content || ''
            }
        }).then(() => location.reload());
    }
    function markAllNotificationsAsRead() {
        fetch('/api/notifications/read-all', {
            method: 'POST',
            headers: {
                'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]')?.content || ''
            }
        }).then(() => location.reload());
    }
    function filterNotifications(type) {
        const items = document.querySelectorAll('.notification-item');
        items.forEach(item => {
            if (type === 'all') {
                item.style.display = 'block';
            } else if (type === 'unread') {
                if (item.getAttribute('data-status') === 'unread') {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            }
        });
    }
</script>
</body>
</html>
