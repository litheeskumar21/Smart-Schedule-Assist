<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | Smart Schedule Assist</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar('notifications')}"></aside>
    <main class="main-content">
        <header class="header" th:replace="~{fragments/header :: header('Notifications')}"></header>

        <div class="flex-between flex-center mb-20">
            <h1 class="page-title" style="margin-bottom: 0;">Notification Center</h1>
            <button onclick="markAllNotificationsAsRead()" class="btn btn-secondary btn-sm">✓ Mark All as Read</button>
        </div>

        <div class="card" th:if="${notifications.isEmpty()}">
            <div class="empty-state">
                <div class="empty-icon">🔔</div>
                <div class="empty-text">You have no notifications at this time.</div>
            </div>
        </div>

        <div class="card" th:if="${!notifications.isEmpty()}" style="padding: 0;">
            <div th:each="n : ${notifications}"
                 class="notification-item"
                 th:classappend="${!n.read} ? 'unread'"
                 th:onclick="'markNotificationRead(' + ${n.id} + ')'"
                 style="padding: 16px 20px; border-bottom: 1px solid var(--border); cursor: pointer;">
                <div class="flex-between flex-center">
                    <span class="notification-title" style="font-size: 15px; font-weight: 600;" th:text="${n.title}">Notification Title</span>
                    <span class="notification-time text-muted" style="font-size: 12px;" th:text="${#temporals.format(n.createdAt, 'MMM dd, yyyy hh:mm a')}">Date</span>
                </div>
                <div class="notification-message text-muted mt-8" style="font-size: 14px;" th:text="${n.message}">Notification detailed message goes here.</div>
                <div class="mt-8" style="display: flex; gap: 8px; align-items: center;">
                    <span class="badge badge-published" th:text="${n.type}">TYPE</span>
                    <span th:if="${!n.read}" class="badge badge-pending" style="font-size: 10px;">Unread</span>
                </div>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/mobile.js}"></script>
<script>
    function markNotificationRead(id) {
        fetch('/api/notifications/' + id + '/read', {
            method: 'POST',
            headers: {
                'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]')?.content || ''
            }
        }).then(() => location.reload());
    }
    function markAllNotificationsAsRead() {
        fetch('/api/notifications/read-all', {
            method: 'POST',
            headers: {
                'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]')?.content || ''
            }
        }).then(() => location.reload());
    }
</script>
</body>
</html>
